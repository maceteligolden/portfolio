<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:0.95" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGradient)"/>
  
  <!-- Main card -->
  <rect x="80" y="120" width="440" height="360" rx="16" fill="url(#cardGradient)" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Header bar -->
  <rect x="80" y="120" width="440" height="60" rx="16" fill="#1F2937"/>
  
  <!-- Header text -->
  <rect x="100" y="140" width="120" height="8" rx="4" fill="#9CA3AF"/>
  <rect x="100" y="155" width="80" height="8" rx="4" fill="#6B7280"/>
  
  <!-- Question card 1 -->
  <rect x="100" y="200" width="400" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="120" y="220" width="200" height="10" rx="5" fill="#374151"/>
  <rect x="120" y="240" width="360" height="8" rx="4" fill="#9CA3AF"/>
  <rect x="120" y="255" width="320" height="8" rx="4" fill="#9CA3AF"/>
  
  <!-- Radio buttons -->
  <circle cx="130" cy="280" r="6" fill="none" stroke="#4F46E5" stroke-width="2"/>
  <rect x="145" y="275" width="100" height="8" rx="4" fill="#D1D5DB"/>
  
  <circle cx="130" cy="300" r="6" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="145" y="295" width="120" height="8" rx="4" fill="#D1D5DB"/>
  
  <!-- Question card 2 -->
  <rect x="100" y="300" width="400" height="80" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <rect x="120" y="320" width="180" height="10" rx="5" fill="#374151"/>
  <rect x="120" y="340" width="360" height="8" rx="4" fill="#9CA3AF"/>
  
  <!-- Radio buttons -->
  <circle cx="130" cy="360" r="6" fill="none" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="145" y="355" width="110" height="8" rx="4" fill="#D1D5DB"/>
  
  <circle cx="130" cy="380" r="6" fill="#4F46E5"/>
  <circle cx="130" cy="380" r="3" fill="#FFFFFF"/>
  <rect x="145" y="375" width="100" height="8" rx="4" fill="#4F46E5" opacity="0.3"/>
  
  <!-- Timer badge -->
  <rect x="420" y="200" width="70" height="30" rx="15" fill="#10B981"/>
  <text x="455" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">15:23</text>
  
  <!-- Progress bar -->
  <rect x="100" y="400" width="400" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="100" y="400" width="240" height="8" rx="4" fill="#4F46E5"/>
  
  <!-- Progress text -->
  <text x="510" y="408" font-family="Arial, sans-serif" font-size="10" fill="#6B7280" text-anchor="end">3 of 10</text>
  
  <!-- Code icon (representing open source) -->
  <g transform="translate(480, 140)">
    <rect x="0" y="0" width="24" height="24" rx="4" fill="#10B981" opacity="0.2"/>
    <path d="M8 6L4 12L8 18M16 6L20 12L16 18" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

